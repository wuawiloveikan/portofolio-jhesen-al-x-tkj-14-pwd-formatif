<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Card Badge</title><style>
body{margin:0;padding:28px;font-family:Arial,sans-serif;background:#080f1d;color:#edf4ff;line-height:1.6}main{max-width:850px;margin:auto}a{color:#68d8ff}
.demo-card{position:relative;max-width:430px;padding:22px;background:#101d32;border:1px solid #294365;border-radius:16px;margin:25px 0}
.badge{position:absolute;top:-12px;right:18px;background:#4ea1ff;color:#071326;padding:5px 12px;border-radius:20px;font-size:.8rem;font-weight:bold}
.top-button{position:fixed;right:22px;bottom:22px;background:#4ea1ff;color:#06101e;text-decoration:none;padding:12px 15px;border-radius:50%;font-weight:bold;box-shadow:0 5px 18px #0008}
</style></head><body id="top"><main><a href="../index.html">← Kembali ke Beranda</a><h1>Card Badge dan Back to Top</h1>
<article class="demo-card"><span class="badge">BARU</span><h2>Belajar CSS</h2><p>Badge ditempatkan di sudut kartu menggunakan position absolute. Kartu menjadi acuan posisi dengan position relative.</p></article>
<p style="margin-top:500px">Gulir ke atas menggunakan tombol di kanan bawah.</p>
</main><a class="top-button" href="#top" aria-label="Kembali ke atas">↑</a></body></html>
