<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Button Set</title>
<style>
body{font-family:Arial,sans-serif;background:#080f1d;color:#edf4ff;padding:28px;line-height:1.6}
main{max-width:850px;margin:auto}.group{display:flex;flex-wrap:wrap;gap:14px;padding:22px;background:#101d32;border-radius:14px}
.btn{padding:11px 18px;border:0;border-radius:8px;background:#286cb3;color:white;cursor:pointer;font-size:15px;transition:background .2s,transform .2s}
.btn:hover{background:#68d8ff;color:#06101e;transform:translateY(-3px)}
.btn-outline{background:transparent;border:1px solid #68d8ff;color:#68d8ff}
.btn-dark{background:#24364f}
</style></head><body><main>
<a href="../index.html">← Kembali ke Beranda</a><h1>Button Set</h1><p>Contoh beberapa tombol dengan efek hover sederhana.</p>
<div class="group"><button class="btn">Primary</button><button class="btn btn-outline">Outline</button><button class="btn btn-dark">Secondary</button></div>
</main></body></html>
